version: '3.8'

services:
  backend:
    build: ./Backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - ./Backend/database.sqlite:/app/database.sqlite

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
